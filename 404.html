<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Roza Gift Corner &amp; Electric</title>
<style>
html{background:#f5f7fa;color:#14263a}@media (prefers-color-scheme:dark){html{background:#0d1722;color:#e8eef5}}
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:"Segoe UI",system-ui,Arial,sans-serif;text-align:center}
a{color:inherit;font-weight:700}p{opacity:.8;margin:6px 0}
</style>
</head>
<body>
<div><p id="m">Loading…</p><p><a id="a" href="/">Go to the shop</a></p></div>
<script>
/* GitHub Pages has no URL rewriting. Any address such as /shop/cart ends up here;
   we remember the clean path and send the visitor to the shop's main page, which restores it (index.html -> route()). */
(function () {
  var g = /\.github\.io$/.test(location.hostname), seg = location.pathname.split('/')[1],
      base = g && seg ? '/' + seg + '/' : '/', path = location.pathname;
  document.getElementById('a').href = base;
  var last = path.split('/').pop();
  /* real files that do not exist (a deleted image, a typo like /shop/x.png) are not shop pages: just go to the shop */
  var isRoute = path.indexOf(base) === 0 && path !== base && last.indexOf('.') < 0;
  if (isRoute) {
    try { sessionStorage.setItem('rg_redirect', path); }
    catch (e) { try { localStorage.setItem('rg_redirect', JSON.stringify({ p: path, t: Date.now() })); } catch (x) {} }
  }
  location.replace(base);
})();
</script>
<noscript>JavaScript is required to open this page.</noscript>
</body>
</html>
