<style>

/* ===== Roza main-app look: same palette, header, hero and footer as the RGCE SparkDesk app ===== */
:root{--bg:#f4f5f7;--panel:#fff;--panel-alt:#f6f8fa;--border:#d0d7de;--border-strong:#9ca3af;--text:#1f2328;--muted:#57606a;--link:#0969da;--primary:#1f4e79;--primary-hover:#163d5e;--primary-light:#f0f6fc;--success:#1a7f37;--danger:#cf222e;--warning:#bf8700;--gold:#d4a72c;--input-bg:#fff;--input-focus:#0969da;--footer-bg:#24292f;--footer-text:#c9d1d9;--footer-muted:#8b949e;--shadow-sm:0 1px 2px rgba(31,35,40,.06);--shadow-md:0 4px 12px rgba(31,35,40,.10);--shadow-lg:0 8px 24px rgba(31,35,40,.14);--rh-navy:#0f2d4a;--rh-navy2:#1f4e79;--rh-gold:#d4a72c}
body.dark-mode{--bg:#14181f;--panel:#1a1e26;--panel-alt:#20252d;--border:#2b3038;--border-strong:#434a54;--text:#e6edf3;--muted:#9ca7b3;--link:#7cb8e8;--primary:#4a90c4;--primary-hover:#5da1d4;--primary-light:#1f2937;--success:#5cb87a;--danger:#e57373;--warning:#d4a843;--input-bg:#14181f;--input-focus:#7cb8e8;--footer-bg:#0e1218;--footer-text:#b8c0c9;--footer-muted:#7a838d;--shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow-md:0 4px 12px rgba(0,0,0,.5);--shadow-lg:0 8px 24px rgba(0,0,0,.6)}
body{--card:var(--panel);--tx:var(--text);--mu:var(--muted);--ac:var(--primary);--gd:var(--gold);--bd:var(--border);--ok:var(--success);--er:var(--danger)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:"NotoBnWeb","Segoe UI","Noto Sans Bengali",-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;font-size:15px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}a{color:inherit}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{width:calc(100% - 40px);max-width:1320px;margin:20px auto 0}
.wrap.grow{flex:1}
/* header (same structure as the main app) */
.hdr2{background:var(--panel);color:var(--text);border-bottom:1px solid var(--border);font-size:13px;position:sticky;top:0;z-index:600;box-shadow:var(--shadow-sm)}
.hdr2-row{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;padding:6px 20px}
.hdr2-top{min-height:68px;border-bottom:1px solid var(--border);flex-wrap:nowrap;gap:10px 18px}
.hdr2-sub{min-height:44px;background:var(--panel-alt);font-size:12px}
.hdr2-group{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dcu-brand{display:flex;align-items:center;gap:12px;flex:none;min-width:0;text-decoration:none;color:inherit}
.dcu-brand img{height:46px;width:46px;border-radius:10px;flex:none;background:#fff}
.dcu-brand b{display:block;font-weight:700;font-size:16.5px;line-height:1.2;color:var(--text)}
.dcu-brand small{display:block;color:var(--muted);font-size:12.5px;line-height:1.2}
.dcu-nav{display:flex;gap:2px;flex:1;justify-content:flex-start;margin-left:8px;min-width:0}
.dcu-nav-item{position:relative}
.dcu-nav-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 10px;border:0;border-radius:8px;background:transparent;color:var(--muted);font:500 14px/1.2 inherit;font-family:inherit;cursor:pointer;white-space:nowrap;text-decoration:none}
.dcu-nav-btn[aria-haspopup]::after{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg) translateY(-2px);opacity:.7}
.dcu-nav-item:hover>.dcu-nav-btn,.dcu-nav-item.open>.dcu-nav-btn,.dcu-nav-btn:focus-visible,.dcu-nav-btn.on{background:var(--panel-alt);color:var(--text)}
.dcu-menu{display:none;position:absolute;left:0;top:calc(100% + 2px);min-width:230px;padding:8px;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);z-index:700}
.dcu-nav-item:hover>.dcu-menu,.dcu-nav-item.open>.dcu-menu,.dcu-nav-item:focus-within>.dcu-menu{display:block}
.dcu-menu a{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;color:var(--text);font:500 14px/1.3 inherit;text-decoration:none}
.dcu-menu a:hover,.dcu-menu a:focus-visible{background:var(--primary-light)}
.dcu-menu a i{width:18px;text-align:center;color:var(--muted);flex:none}
.hdr-pill{display:inline-flex;align-items:center;gap:7px;padding:7px 16px;border-radius:999px;font:600 13px/1.2 inherit;font-family:inherit;cursor:pointer;border:1px solid transparent;text-decoration:none;position:relative;transition:opacity .15s,background .15s}
.hdr-pill:active{transform:scale(.96)}.hdr-pill i{font-size:12px}
.hdr-pill-gold{background:var(--gold);color:#3b2a00;border-color:var(--gold)}.hdr-pill-gold:hover{opacity:.9}
.hdr-pill-gold b{background:#3b2a00;color:#fff;font-size:11px;min-width:19px;height:19px;border-radius:10px;display:inline-grid;place-items:center;padding:0 5px}
.hdr-pill-outline{background:transparent;color:var(--text);border-color:var(--border-strong)}.hdr-pill-outline i{color:var(--muted)}.hdr-pill-outline:hover{background:var(--panel-alt)}
.dcu-menu-btn{display:none}
.hdr-chip{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--text);font:600 12px/1.2 inherit;font-family:inherit;cursor:pointer;min-height:30px}.hdr-chip:hover{background:var(--bg)}
.hdr-chip i{color:var(--muted);font-size:12px}
.hdr-search{flex:1 1 280px;max-width:520px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:0 6px 0 11px;min-height:32px}
.hdr-search:focus-within{border-color:var(--input-focus);box-shadow:0 0 0 3px rgba(9,105,218,.14)}.hdr-search>i{color:var(--muted);font-size:12px}
.hdr-search input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font:inherit;font-size:14px;padding:6px 0;outline:0}
.hdr-search button{background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:0 6px}.hdr-search button[hidden]{display:none}
.dark-toggle-label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;padding:5px 10px;background:var(--panel);border:1px solid var(--border);border-radius:8px;min-height:30px}.dark-toggle-label:hover{color:var(--text)}
.dark-toggle-label input{width:14px;height:14px;accent-color:var(--gold);cursor:pointer}
@media(max-width:1000px){
  .hdr2{position:relative}
  .hdr2-row{padding:6px 12px}.hdr2-top{flex-wrap:wrap}
  .dcu-menu-btn{display:inline-flex}
  .dcu-nav{display:none;order:9;flex:1 0 100%;flex-direction:column;gap:6px;margin:0;padding:8px 0 10px;border-top:1px solid var(--border);max-height:68vh;overflow:auto}
  .dcu-nav.open{display:flex}
  .dcu-nav-btn{width:100%;justify-content:space-between;font-weight:600;color:var(--text)}
  .dcu-nav-btn[aria-haspopup]::after{display:none}
  .dcu-menu{display:block;position:static;box-shadow:none;border:0;padding:0 0 4px 8px;min-width:0;background:transparent}
  .hdr-pill{padding:7px 12px}
  .dcu-brand{flex:1}
}
@media(max-width:520px){.dcu-brand b{font-size:14.5px}.dcu-brand small{font-size:11.5px}.dcu-brand img{height:40px;width:40px}.hdr-pill-gold span{display:none}.hdr-search{flex-basis:100%;max-width:none}}
/* welcome hero (light: white card, dark: navy gradient, like the main app) */
.hero{position:relative;overflow:hidden;border-radius:22px;margin-bottom:20px;background:var(--panel);color:var(--text);border:1px solid var(--border);box-shadow:var(--shadow-md)}
.hero .in{position:relative;padding:44px 32px 40px}
.eyebrow{display:inline-block;color:#8a6a0a;font-weight:700;font-size:12.5px;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px}
.hero h1{margin:0;font-size:clamp(28px,6vw,48px);line-height:1.15;font-weight:800;max-width:16ch;color:var(--rh-navy)}
.hero p{margin:14px 0 0;max-width:46ch;color:var(--muted);font-size:clamp(15px,2.6vw,17px)}
.gl{margin-top:24px;height:3px;width:84px;background:var(--rh-gold);border-radius:3px}
body.dark-mode .hero{background:linear-gradient(135deg,var(--rh-navy) 0%,var(--rh-navy2) 100%);color:#fff;border-color:transparent}
body.dark-mode .hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:linear-gradient(to bottom,#000,transparent);mask-image:linear-gradient(to bottom,#000,transparent)}
body.dark-mode .eyebrow{color:var(--rh-gold)}body.dark-mode .hero h1{color:#fff}body.dark-mode .hero p{color:#fff;opacity:.85}
.rh-acts{--rc:#0f2d4a;display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;position:relative}
body.dark-mode .rh-acts{--rc:#e6c35c}
.rh-b{display:inline-flex;align-items:stretch;padding:0;font-weight:700;font-size:14.5px;line-height:1.2;white-space:nowrap;cursor:pointer;color:var(--rc);background:transparent;border:2px solid var(--rc);border-radius:10px;overflow:hidden;text-decoration:none;transition:background .15s,color .15s}
.rh-b i{display:inline-flex;align-items:center;padding:0 0 0 16px;font-size:15px}.rh-b span{display:inline-flex;align-items:center;padding:10px 18px 10px 8px}
.rh-b:hover{background:var(--rc);color:#fff}body.dark-mode .rh-b:hover{color:#0b1117}.rh-b:focus-visible{outline:3px solid var(--rc);outline-offset:3px}
@media(max-width:600px){.hero .in{padding:32px 20px 28px}.rh-b{width:100%}.rh-b span{flex:1}}

/* slim welcome strip (replaces the big hero) */
.hero{border-radius:14px;margin-bottom:16px;border-left:5px solid var(--rh-gold);box-shadow:var(--shadow-sm)}
.hero .in{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 24px;padding:14px 20px}
.hero .ht{min-width:0;flex:1 1 320px}
.hero .eyebrow{font-size:11px;letter-spacing:1.6px;margin:0 0 2px}
.hero h1{font-size:clamp(18px,3.2vw,23px);line-height:1.25;max-width:none}
.hero p{margin:2px 0 0;font-size:13.5px;max-width:none}
.hero .gl{display:none}
.rh-acts{margin-top:0;gap:8px}
.rh-b{font-size:13px;border-width:1.5px;border-radius:9px}
.rh-b i{padding-left:12px;font-size:13px}.rh-b span{padding:7px 13px 7px 7px}
@media(max-width:600px){.hero .in{padding:12px 14px}.rh-acts{width:100%}.rh-b{width:auto;flex:1 1 calc(50% - 8px)}.rh-b span{flex:1;justify-content:center}}
/* product area restyled to the main-app cards */
.sec h2{font-size:1.2rem}.sec span{color:var(--muted)}
.p{border-radius:14px;box-shadow:var(--shadow-sm)}.p:hover{box-shadow:var(--shadow-md)}
.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.pr{color:var(--primary)}
.b1{background:var(--primary);border-color:var(--primary);color:#fff}.b2{color:var(--primary);border-color:var(--primary)}
.b3{background:var(--gold);border-color:var(--gold);color:#3b2a00}
.f input,.f textarea{background:var(--input-bg)}.f input:focus,.f textarea:focus{outline:0;border-color:var(--input-focus);box-shadow:0 0 0 3px rgba(9,105,218,.14)}
.mt{margin:0 0 20px;max-width:none}
body.dark-mode .mt{background:#3a2e10;color:#ffd987;border-color:#5a4720}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 14px}
.bar{background:var(--panel)}
@media(min-width:821px){.bar,.spm{display:none!important}.tm{bottom:30px}}
/* footer (same grid as the main app) */
.app-footer{background:var(--footer-bg);color:var(--footer-text);font-size:13px;display:grid;grid-template-columns:1.5fr 1fr 1fr;grid-template-areas:"brand links social" "contact links badges" "copy copy toggles";column-gap:40px;row-gap:14px;padding:36px max(20px,calc((100% - 1320px)/2)) 20px;margin-top:30px}
.app-foot-brand{grid-area:brand;display:flex;align-items:center;gap:12px;text-decoration:none}
.app-foot-brand img{height:50px;width:50px;border-radius:10px;background:#fff}
.app-foot-brand b{display:block;font-size:18px;font-weight:700;color:#fff;line-height:1.2}.app-foot-brand small{color:var(--footer-muted);font-size:13px}
.footer-links,.footer-social,.footer-badges{display:flex}
.footer-links{grid-area:links;flex-direction:column;align-items:flex-start;gap:6px}
.footer-links a{color:var(--footer-text);font-size:14.5px;font-weight:500;text-decoration:none}.footer-links a:hover{color:#fff}
.footer-links::before,.footer-social::before,.footer-badges::before{font-size:16px;font-weight:700;color:#fff;margin-bottom:4px}
.footer-social::before,.footer-badges::before{flex-basis:100%}
.footer-links::before{content:"Explore"}.footer-social::before{content:"Follow us"}.footer-badges::before{content:"Services"}
html[lang="bn"] .footer-links::before{content:"অন্বেষণ"}html[lang="bn"] .footer-social::before{content:"আমাদের অনুসরণ করুন"}html[lang="bn"] .footer-badges::before{content:"সেবা"}
.footer-contact{grid-area:contact;display:flex;flex-direction:column;align-items:flex-start;gap:8px;font-size:14px;color:var(--footer-text)}
.footer-contact i{color:var(--gold);margin-right:6px;width:14px;text-align:center}.footer-contact a{color:inherit;font-weight:700;text-decoration:underline}
.footer-social{grid-area:social;flex-wrap:wrap;align-content:flex-start;justify-content:flex-start;gap:12px 16px;font-size:16px}
.footer-social a{color:var(--footer-muted);transition:color .15s,transform .15s;text-decoration:none}.footer-social a:hover{color:#fff;transform:translateY(-2px)}
.footer-badges{grid-area:badges;flex-wrap:wrap;gap:8px;align-content:flex-start}
.badge{padding:3px 10px;font-size:12px;color:var(--footer-muted);background:rgba(255,255,255,.06);border-radius:999px}
.footer-copy{grid-area:copy;font-size:13.5px;color:var(--footer-muted);align-self:center}.footer-copy a{color:var(--gold);font-weight:600;text-decoration:none}.footer-copy a:hover{color:#fff}
.app-foot-toggles{grid-area:toggles;display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.app-foot-toggles button{min-height:34px;padding:0 14px;border:1px solid rgba(255,255,255,.3);border-radius:999px;background:transparent;color:#fff;font:500 13px/1 inherit;font-family:inherit;cursor:pointer}.app-foot-toggles button:hover{background:rgba(255,255,255,.12)}
@media(max-width:820px){.app-footer{grid-template-columns:1fr 1fr;grid-template-areas:"brand brand" "contact contact" "links social" "badges badges" "copy copy" "toggles toggles";column-gap:24px;padding-bottom:84px}.app-foot-toggles{justify-content:flex-start}}
@media(max-width:480px){.app-footer{grid-template-columns:1fr;grid-template-areas:"brand" "contact" "links" "social" "badges" "copy" "toggles"}}
@media(max-width:520px){.grid{gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}.cb span{display:none}}
main{padding:8px 0 28px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}.sec h2{margin:0;font-size:1.15rem}.sec span{color:var(--mu);font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.p{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:.2s}.p:hover{box-shadow:0 8px 24px rgba(15,45,74,.12);transform:translateY(-2px)}
.p img{width:100%;aspect-ratio:1;object-fit:cover;background:var(--bd);display:block}

/* cart drawer + order sheet: sit ABOVE the sticky header (z-index), drawer on desktop, bottom sheet on phones */

body.nol{overflow:hidden}

$('#yr').textContent=new Date().getFullYear();paint();
let P=[],cart={};try{cart=JSON.parse(localStorage.getItem('rg_cart')||'{}')}catch(e){}
const keep=()=>{try{localStorage.setItem('rg_cart',JSON.stringify(cart))}catch(e){}};
const find=id=>P.find(p=>p.id===id);
const lines=()=>Object.keys(cart).map(id=>({p:find(id),q:cart[id]})).filter(x=>x.p&&x.q>0);
const sum=a=>a.reduce((t,x)=>t+x.p.price*x.q,0);
function toast(m){const t=$('#tm');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',1800)}
function badge(){$('#cn').textContent=$('#cn2').textContent=bn(lines().reduce((t,x)=>t+x.q,0))}
function draw(){
  sMark();
  const k=$('#q').value.trim().toLowerCase(),v=P.filter(p=>p.on&&(!k||(p.name+' '+(p.desc||'')).toLowerCase().includes(k)));
  $('#cnt').textContent=v.length?bn(v.length)+(L==='bn'?'':' ')+t('items'):'';
  $('#g').innerHTML=v.length?v.map(p=>'<article class="p"><img loading="lazy" src="'+esc(BASE+p.img)+'" alt="'+esc(p.name)+'"><div class="pb"><b>'+esc(p.name)+'</b>'+(p.desc?'<small>'+esc(p.desc)+'</small>':'')+'<div class="pr">'+tk(p.price)+'</div><div class="ac"><button class="b1" data-a="add" data-id="'+esc(p.id)+'">'+t('add')+'</button><button class="b2" data-a="buy" data-id="'+esc(p.id)+'">'+t('buy')+'</button></div></div></article>').join(''):'<div class="em">'+t('none')+'</div>';
}
const nav=(r,rp)=>{try{history[rp?'replaceState':'pushState'](null,'',BASE+r)}catch(e){}route()};
const close=()=>{if(location.pathname!==BASE)nav('');else{$('#ov').className='ov';$('#ov').innerHTML='';document.body.classList.remove('nol')}};
function route(){
  const r=location.pathname.slice(BASE.length).replace(/index\.html$/,'').replace(/^\/+|\/+$/g,''),sp=r.split('/');let on='';
  $('#ov').className='ov';$('#ov').innerHTML='';
  if(sp[0]==='cart'){cartView();on='cart'}
  else if(sp[0]==='checkout'){const l=lines();if(l.length)checkout(l,true);else return nav('cart',1);on='cart'}
  else if(sp[0]==='buy-now'&&find(sp[1]))checkout([{p:find(sp[1]),q:1}],false);
  else if(r&&P.length)history.replaceState(null,'',BASE);
  document.body.classList.toggle('nol',$('#ov').classList.contains('on'));
  document.querySelectorAll('a[data-r]').forEach(a=>{a.href=BASE+a.dataset.r;a.classList.toggle('on',a.dataset.r===on)});
}
window.addEventListener('popstate',route);
function cartView(){
  const L=lines(),n=L.reduce((t,x)=>t+x.q,0),sb=sum(L),dl=ship(sb);$('#ov').className='ov on';
  const hint=L.length&&SHIP.charge>0&&SHIP.freeAbove>0&&sb<SHIP.freeAbove?'<div class="hint">'+t('more').replace('{x}',tk(SHIP.freeAbove-sb))+'</div>':'';
  $('#ov').innerHTML='<div class="dr" role="dialog" aria-modal="true" aria-label="'+t('yc')+'"><div class="dh"><div class="dht"><span class="dic"><i class="fas fa-cart-shopping" aria-hidden="true"></i></span><div><h3>'+t('yc')+'</h3>'+(n?'<small>'+bn(n)+' '+t('itm')+'</small>':'')+'</div></div><button class="x" data-a="close" aria-label="'+t('close')+'">×</button></div>'
  +'<div class="db">'+(L.length?L.map(x=>'<div class="ln"><img src="'+esc(BASE+x.p.img)+'" alt=""><div><b>'+esc(x.p.name)+'</b><span class="lp">'+tk(x.p.price)+'</span><div class="lr"><span class="q"><button data-a="dec" data-id="'+esc(x.p.id)+'" aria-label="−">−</button><span>'+bn(x.q)+'</span><button data-a="inc" data-id="'+esc(x.p.id)+'" aria-label="+">+</button></span><span class="lt">'+tk(x.p.price*x.q)+'</span></div></div><button class="rm" data-a="rm" data-id="'+esc(x.p.id)+'" aria-label="'+t('rm')+'">×</button></div>').join(''):'<div class="empty"><i class="fas fa-cart-shopping" aria-hidden="true"></i><div>'+t('empty')+'</div></div>')+'</div>'
  +(L.length?'<div class="df">'+hint+'<div class="srow"><span>'+t('sub')+'</span><span>'+tk(sb)+'</span></div><div class="srow"><span>'+t('del')+'</span><span>'+(dl?tk(dl):t('free'))+'</span></div><div class="tt"><span>'+t('total')+'</span><span>'+tk(sb+dl)+'</span></div><button class="b3 big" data-a="co">'+t('order')+' →</button><button class="lnk2" data-a="close">'+t('cont')+'</button></div>':'<div class="df"><button class="b2 big" data-a="close">'+t('cont')+'</button></div>')+'</div>';
}
function checkout(items,fromCart){
  $('#ov').className='ov on';
  const sb=sum(items),dl=ship(sb);
  $('#ov').innerHTML='<div class="md" role="dialog" aria-modal="true" aria-label="'+t('dt')+'"><div class="dh"><div class="dht"><span class="dic"><i class="fas fa-bag-shopping" aria-hidden="true"></i></span><div><h3>'+t('dt')+'</h3><small>'+t('onDel')+'</small></div></div><button class="x" data-a="close" aria-label="'+t('close')+'">×</button></div>'
  +'<div class="steps"><span class="done">✓ '+t('stc')+'</span><span class="on">2 · '+t('std')+'</span><span>3 · '+t('stf')+'</span></div>'
  +'<div class="mb"><div class="cs"><h4><i class="fas fa-receipt" aria-hidden="true"></i>'+t('sumh')+'</h4><div class="sm">'+items.map(x=>'<div><span>'+esc(x.p.name)+' × '+bn(x.q)+'</span><span>'+tk(x.p.price*x.q)+'</span></div>').join('')+'<div class="tl"><span>'+t('del')+'</span><span>'+(dl?tk(dl):t('free'))+'</span></div><div><span>'+t('pay')+'</span><span>'+t('onDel')+'</span></div><div class="gt"><span>'+t('gt')+'</span><span>'+tk(sb+dl)+'</span></div></div></div>'
  +'<div class="cs"><h4><i class="fas fa-user" aria-hidden="true"></i>'+t('yd')+'</h4><div class="f"><label for="cn1">'+t('nm')+'</label><input id="cn1" autocomplete="name"></div><div class="f"><label for="cp">'+t('ph')+'</label><input id="cp" type="tel" inputmode="numeric" autocomplete="tel" placeholder="01XXXXXXXXX"></div>'
  +'<div class="f"><label for="ca">'+t('ad')+'</label><textarea id="ca" rows="3" maxlength="300" autocomplete="street-address"></textarea></div><div class="f"><label for="cm">'+t('nt')+'</label><input id="cm"></div></div>'
  +'<div class="er" id="er" role="alert"></div></div>'
  +'<div class="mf"><button class="b3 big" id="go">'+t('conf')+'</button>'+(fromCart?'<button class="lnk2" data-a="backc">← '+t('back')+'</button>':'')+'</div></div>';
  {const d=sg('rg_draft')||{};['cn1','cp','ca','cm'].forEach(i=>{if(d[i])$('#'+i).value=d[i]})}
  $('#go').onclick=async()=>{
    const name=$('#cn1').value.trim(),ph=$('#cp').value.replace(/[\s-]/g,'').replace(/[০-৯]/g,d=>'০১২৩৪৫৬৭৮৯'.indexOf(d)),ad=$('#ca').value.trim(),er=$('#er');
    if(name.length<2)return er.textContent=t('e1');
    if(!/^(\+?88)?01[3-9]\d{8}$/.test(ph))return er.textContent=t('e2');
    if(ad.length<8)return er.textContent=t('e3');
    const b=$('#go');b.disabled=true;b.textContent=t('wait');er.textContent='';
    try{
      if(items.length>40)throw new Error('x');
      const r=crypto.getRandomValues(new Uint32Array(2)),d=new Date(),no='RG'+String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+String(r[0]%10000).padStart(4,'0'),sub=sum(items),dl=ship(sub);
      await setDoc(doc(db,'orders',no.toLowerCase()+r[1].toString(36)),{orderNo:no,name:name.slice(0,80),phone:ph.replace(/^\+?88/,''),area:'',address:ad.slice(0,300),note:$('#cm').value.trim().slice(0,400),items:items.map(x=>({name:x.p.name,qty:x.q,price:x.p.price})),subtotal:sub,delivery:dl,total:sub+dl,payment:'cod',status:'new',source:'shop',createdAt:serverTimestamp()});
      ss('rg_draft');if(fromCart){cart={};keep();badge()}
      $('#ov').innerHTML='<div class="md" role="dialog" aria-modal="true"><div class="dh"><div class="dht"><span class="dic"><i class="fas fa-circle-check" aria-hidden="true"></i></span><div><h3>'+t('done')+'</h3></div></div><button class="x" data-a="close" aria-label="'+t('close')+'">×</button></div><div class="steps"><span class="done">✓ '+t('stc')+'</span><span class="done">✓ '+t('std')+'</span><span class="on">✓ '+t('stf')+'</span></div><div class="mb"><div class="ok"><div class="ck"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div><p>'+t('onum')+'</p><span class="ono">'+no+'</span><p>'+t('soon')+'</p><button class="b3 big" data-a="close">'+t('ok')+'</button></div></div></div>';
    }catch(e){console.warn(e);b.disabled=false;b.textContent=t('conf');er.innerHTML=t('fail')+' <a href="'+wl(t('m2'))+'" target="_blank" rel="noopener">'+t('gethelp')+'</a>.'}
  };
}
document.addEventListener('click',e=>{
  if(e.target.id==='ov')return close();
  const rl=e.target.closest('a[data-r]');if(rl){e.preventDefault();nav(rl.dataset.r);return}
  const b=e.target.closest('[data-a]');if(!b)return
  const a=b.dataset.a,id=b.dataset.id,p=find(id);
  if(a==='add'&&p){cart[id]=(cart[id]||0)+1;keep();badge();toast(t('added'))}
  else if(a==='buy'&&p)nav('buy-now/'+id);
  else if(a==='inc'){cart[id]++;keep();badge();cartView()}
  else if(a==='dec'){cart[id]=Math.max(1,cart[id]-1);keep();badge();cartView()}
  else if(a==='rm'){delete cart[id];keep();badge();cartView()}
  else if(a==='co')nav('checkout');
  else if(a==='backc')nav('cart');
  else if(a==='close')close();
});
$('#lg').addEventListener('click',()=>{L=L==='bn'?'en':'bn';try{localStorage.setItem('rg_lang',L)}catch(e){}paint();close();draw();badge()});
const shut=()=>{$('#spm').classList.remove('on');$('#sp').classList.remove('on');$('#sp').setAttribute('aria-expanded','false')};
$('#sp').addEventListener('click',e=>{e.stopPropagation();const o=$('#spm').classList.toggle('on');$('#sp').classList.toggle('on',o);$('#sp').setAttribute('aria-expanded',o)});
document.addEventListener('click',e=>{if(!e.target.closest('#spm'))shut()});
const navShut=()=>{$('#nav').classList.remove('open');$('#mBtn').setAttribute('aria-expanded','false');document.querySelectorAll('.dcu-nav-item.open').forEach(x=>{x.classList.remove('open');const b=x.querySelector('[aria-haspopup]');if(b)b.setAttribute('aria-expanded','false')})};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){shut();navShut();close()}});
const hh=()=>{};
function sMark(){$('#sx').hidden=!$('#q').value.trim()}
$('#sx').addEventListener('click',()=>{$('#q').value='';draw();$('#q').focus()});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.target.blur();const m=document.getElementById('products');if(m)m.scrollIntoView({behavior:'smooth',block:'start'})}});
/* header menu (mobile) + Support drop-down */
$('#mBtn').addEventListener('click',e=>{e.stopPropagation();const o=$('#nav').classList.toggle('open');$('#mBtn').setAttribute('aria-expanded',o)});
$('#supBtn').addEventListener('click',e=>{e.stopPropagation();const it=$('#supBtn').parentNode,o=!it.classList.contains('open');navShut();if(o){it.classList.add('open');$('#supBtn').setAttribute('aria-expanded','true');$('#nav').classList.add('open')}});
document.addEventListener('click',e=>{if(!e.target.closest('.dcu-nav-item,#mBtn'))navShut();else if(e.target.closest('a.dcu-nav-btn'))navShut()});
/* dark mode (same switch as the main app) + footer language / dark buttons */
const setDark=on=>{document.body.classList.toggle('dark-mode',on);$('#dk').checked=on;try{localStorage.setItem('rg_dark',on?'1':'0')}catch(e){}const m=document.querySelector('meta[name=theme-color]');if(m)m.content=on?'#14181f':'#1f4e79'};
$('#dk').checked=document.body.classList.contains('dark-mode');setDark($('#dk').checked);
$('#dk').addEventListener('change',e=>setDark(e.target.checked));
$('#dkF').addEventListener('click',()=>setDark(!document.body.classList.contains('dark-mode')));
document.querySelectorAll('[data-l]').forEach(b=>b.addEventListener('click',()=>{if(L!==b.dataset.l)$('#lg').click()}));
document.querySelectorAll('a[href="#products"]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();if(location.pathname!==BASE)nav('');const m=document.getElementById('products');if(m)m.scrollIntoView({behavior:'smooth',block:'start'})}));
$('#q').addEventListener('input',draw);
let rs=null;try{const nv=performance.getEntriesByType('navigation')[0];if(nv&&nv.type==='back_forward')rs=sg('rg_ui')}catch(e){}
let MT=null;const mtPaint=()=>{const e=$('#mt'),m=MT&&MT.on===true?(L==='bn'?(MT.msgBn||MT.msgEn):(MT.msgEn||MT.msgBn)):'';e.textContent=m||'';e.hidden=!m;document.body.classList.toggle('mtn',!!m);try{hh()}catch(x){}};
try{onSnapshot(doc(db,'site_public','shop-site'),d=>{MT=d.exists()?d.data():null;mtPaint()},e=>console.warn('notice',e))}catch(e){}
$('#lg').addEventListener('click',mtPaint);
fetch(BASE+'products.json?t='+Date.now()).then(r=>r.ok?r.json():[]).catch(()=>[]).then(d=>{P=Array.isArray(d)?d:[];if(rs)$('#q').value=rs.q||'';draw();badge();route();if(rs)requestAnimationFrame(()=>scrollTo(0,rs.y||0))});
</script>
</body>
</html>
